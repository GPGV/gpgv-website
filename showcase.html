<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Showcase — GPGV</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,400&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
<style>
  :root{--bg:#0d0c10;--card:#16151b;--ink:#f3f0ea;--dim:#a09aa8;--pink:#ff5ca8;--gold:#e3b341;--line:#2a2730}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter Tight',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:24px}
  .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  .back{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);text-decoration:none;letter-spacing:.12em}
  .admin-btn{font-family:'JetBrains Mono',monospace;font-size:11px;background:none;border:1px solid var(--line);color:var(--dim);padding:7px 12px;border-radius:6px;cursor:pointer}
  header{text-align:center;padding:42px 0 10px}
  .kick{font-family:'JetBrains Mono',monospace;letter-spacing:.35em;font-size:11px;color:var(--pink);text-transform:uppercase}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(2.6rem,7vw,4.6rem);margin:12px 0;line-height:1}
  .lead{color:var(--dim);max-width:560px;margin:0 auto;font-size:17px}
  .count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);margin-top:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin:40px 0}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
  .item:hover{transform:translateY(-5px);border-color:var(--pink)}
  .item .img{aspect-ratio:1/1;background:#222 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#555;font-size:40px}
  .item .b{padding:16px;display:flex;flex-direction:column;flex:1}
  .item h3{font-family:'Fraunces',serif;font-size:1.25rem;margin-bottom:6px}
  .item p{color:var(--dim);font-size:14px;line-height:1.5;flex:1}
  .item .buy{margin-top:14px;display:block;text-align:center;background:linear-gradient(100deg,var(--pink),var(--gold));color:#0d0c10;font-weight:700;text-decoration:none;padding:11px;border-radius:8px;font-size:14px}
  .item .edit{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);border:none;color:#fff;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:11px;display:none}
  .item{position:relative}
  body.admin .item .edit{display:block}
  .empty{text-align:center;color:var(--dim);padding:60px;border:1px dashed var(--line);border-radius:14px}
  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .scrim.on{display:flex}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
  .modal h2{font-family:'Fraunces',serif;margin-bottom:14px}
  label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.05em}
  input,textarea{width:100%;padding:11px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:inherit;font-size:14px}
  textarea{min-height:70px;resize:vertical}
  .row{display:flex;gap:10px;margin-top:18px}
  .row button{flex:1;padding:12px;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px}
  .save{background:linear-gradient(100deg,var(--pink),var(--gold));color:#0d0c10}
  .del{background:#3a1620;color:#ff8aa8}
  .cancel{background:var(--line);color:var(--ink)}
  .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;margin-top:8px;display:none}
  footer{text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--dim);padding:40px 0}
</style>
</head>
<body><div class="wrap">
  <div class="top"><a class="back" href="index.html">← GPGV</a><button class="admin-btn" onclick="toggleAdmin()">◆ Admin</button></div>
  <header>
    <div class="kick">Worn · Loved · Recommended</div>
    <h1>The Showcase</h1>
    <p class="lead">A rotating drop of what I'm wearing and loving right now. Twenty pieces, swapped in and out. Tap to shop.</p>
    <div class="count" id="count"></div>
  </header>
  <div class="grid" id="grid"></div>
  <footer>THE SHOWCASE · A GPGV EDIT · affiliate links may earn a commission</footer>
</div>

<div class="scrim" id="scrim"><div class="modal">
  <h2 id="mtitle">Add Item</h2>
  <label>Photo</label>
  <input type="file" id="f-file" accept="image/*" onchange="readImg(this)"/>
  <input type="text" id="f-imgurl" placeholder="…or paste an image URL" oninput="previewUrl(this.value)" style="margin-top:8px"/>
  <img class="thumb" id="thumb"/>
  <label>Title</label><input type="text" id="f-title" placeholder="e.g. Vintage Leather Jacket"/>
  <label>Your write-up</label><textarea id="f-desc" placeholder="Why you love it…"></textarea>
  <label>Affiliate / funnel link</label><input type="url" id="f-link" placeholder="https://…"/>
  <label>Button label</label><input type="text" id="f-cta" placeholder="Shop now" value="Shop now"/>
  <div class="row"><button class="save" onclick="saveItem()">Save</button><button class="del" id="delBtn" onclick="delItem()" style="display:none">Delete</button><button class="cancel" onclick="closeModal()">Cancel</button></div>
</div></div>

<script>
var KEY='gpgv_showcase', ADMINPW='Dreplay2$$$', MAX=20, editId=null, imgData='';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(a){localStorage.setItem(KEY,JSON.stringify(a))}
function esc(s){return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}
function render(){
  var items=load(), g=document.getElementById('grid');
  document.getElementById('count').textContent=items.length+' / '+MAX+' pieces';
  if(!items.length){g.innerHTML='<div class="empty">No items yet. Hit ◆ Admin to add your first piece.</div>';return}
  g.innerHTML=items.map(function(it){
    var img=it.img?('style="background-image:url('+JSON.stringify(it.img)+')"'):'';
    var icon=it.img?'':'🛍️';
    var buy=it.link?'<a class="buy" href="'+esc(it.link)+'" target="_blank" rel="noopener">'+esc(it.cta||'Shop now')+'</a>':'';
    return '<div class="item"><button class="edit" onclick="openEdit(\''+it.id+'\')">edit</button>'
      +'<div class="img" '+img+'>'+icon+'</div><div class="b"><h3>'+esc(it.title)+'</h3><p>'+esc(it.desc)+'</p>'+buy+'</div></div>';
  }).join('');
}
function toggleAdmin(){
  if(document.body.classList.contains('admin')){document.body.classList.remove('admin');return}
  var p=prompt('Admin password:'); if(p===ADMINPW){document.body.classList.add('admin');openAdd();}else if(p!==null)alert('Nope.');
}
function openAdd(){var items=load();if(items.length>=MAX){alert('You\'re at 20 items. Edit or delete one to rotate a new piece in.');return}
  editId=null;imgData='';document.getElementById('mtitle').textContent='Add Item';document.getElementById('delBtn').style.display='none';
  ['f-title','f-desc','f-link','f-imgurl'].forEach(i=>document.getElementById(i).value='');document.getElementById('f-cta').value='Shop now';
  document.getElementById('thumb').style.display='none';document.getElementById('scrim').classList.add('on');}
function openEdit(id){var it=load().find(x=>x.id===id);if(!it)return;editId=id;imgData=it.img||'';
  document.getElementById('mtitle').textContent='Edit Item';document.getElementById('delBtn').style.display='block';
  document.getElementById('f-title').value=it.title||'';document.getElementById('f-desc').value=it.desc||'';
  document.getElementById('f-link').value=it.link||'';document.getElementById('f-cta').value=it.cta||'Shop now';
  document.getElementById('f-imgurl').value=(it.img&&it.img.indexOf('data:')!==0)?it.img:'';
  var t=document.getElementById('thumb');if(it.img){t.src=it.img;t.style.display='block'}else t.style.display='none';
  document.getElementById('scrim').classList.add('on');}
function readImg(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=e=>{imgData=e.target.result;var t=document.getElementById('thumb');t.src=imgData;t.style.display='block'};r.readAsDataURL(f);}
function previewUrl(u){if(!u)return;imgData=u;var t=document.getElementById('thumb');t.src=u;t.style.display='block';}
function saveItem(){var items=load();var o={id:editId||('it'+Date.now()),title:document.getElementById('f-title').value.trim(),
  desc:document.getElementById('f-desc').value.trim(),link:document.getElementById('f-link').value.trim(),
  cta:document.getElementById('f-cta').value.trim()||'Shop now',img:imgData};
  if(!o.title){alert('Add a title.');return}
  if(editId){var i=items.findIndex(x=>x.id===editId);items[i]=o}else{if(items.length>=MAX){alert('Max 20.');return}items.push(o)}
  save(items);closeModal();render();}
function delItem(){if(!editId)return;if(!confirm('Delete this item?'))return;save(load().filter(x=>x.id!==editId));closeModal();render();}
function closeModal(){document.getElementById('scrim').classList.remove('on');}
render();
</script>
<script src="gpgv-edit.js"></script>
</body></html>
